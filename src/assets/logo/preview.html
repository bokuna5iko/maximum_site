      font-size: 0.8rem;
      max-width: 220px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));

    .panel { margin: 0; text-align: center; }
    .mark-wrap { display: inline-block; }
